#UI tests       → Playwright
#API tests      → requests
#Assertions     → Python assert
#Fixtures       → pytest

[project]
name = "manual-project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmytro925", email = "vilalobus365@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
log_cli = true
log_cli_level = "INFO"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)8s]: %(message)s (%(filename)s:%(lineno)s)"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s [%(levelname)8s]: %(message)s (%(filename)s:%(lineno)s)"

[tool.ruff.lint]
extend-select = ["ANN", "D"]
ignore = [
    "D100",
    "D104",
    "D107",
    "D202",  # conflicts with D205: don't enforce blank line after docstring
    "D203",  # conflicts with D211
    "D205",  # conflicts with D202
    "D210",  # conflicts with D209
    "D213",  # conflicts with D212
    "D401",  # no imperative-mood enforcement
    "D402",  # no imperative-mood enforcement
    "D415",  # conflicts with D400
]

[tool.ruff.lint.per-file-ignores]
# Test code: no missing-docstring enforcement
"test_*.py" = ["ANN201", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D209", "D400"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
