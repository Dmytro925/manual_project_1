name: Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        type: choice
        options:
          - all
          - api
          - ui
        default: all
      browser:
        description: "Browser for UI tests"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium

env:
  BASE_URL: ${{ secrets.BASE_URL }}
  API_BASE_URL: ${{ secrets.API_BASE_URL }}
  STANDARD_USER_USERNAME: ${{ secrets.STANDARD_USER_USERNAME }}
  STANDARD_USER_PASSWORD: ${{ secrets.STANDARD_USER_PASSWORD }}
  LOCKED_USER_USERNAME: ${{ secrets.LOCKED_USER_USERNAME }}
  LOCKED_USER_PASSWORD: ${{ secrets.LOCKED_USER_PASSWORD }}
  ADMIN_USER_USERNAME: ${{ secrets.ADMIN_USER_USERNAME }}
  ADMIN_USER_PASSWORD_TEMPLATE: ${{ secrets.ADMIN_USER_PASSWORD_TEMPLATE }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.suite == 'all' || inputs.suite == 'api' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run API tests
        run: uv run pytest tests/api_tests/

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: allure-results/
          if-no-files-found: ignore

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.suite == 'all' || inputs.suite == 'ui' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps ${{ inputs.browser }}

      - name: Run UI tests
        run: uv run pytest tests/ui_tests/ --browser ${{ inputs.browser }}

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui
          path: allure-results/
          if-no-files-found: ignore

  publish-report:
    name: Publish Allure Reports
    needs: [api-tests, ui-tests]
    if: always()
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download API Allure results
        if: needs.api-tests.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results-api
          path: results/api

      - name: Download UI Allure results
        if: needs.ui-tests.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results-ui
          path: results/ui

      - name: Install Allure 3
        run: npm install -g allure

      - name: Generate API Allure report
        if: ${{ hashFiles('results/api/**') != '' }}
        run: allure generate results/api -o site/api

      - name: Generate UI Allure report
        if: ${{ hashFiles('results/ui/**') != '' }}
        run: allure generate results/ui -o site/ui

      - name: Create Allure reports index
        if: ${{ hashFiles('results/api/**', 'results/ui/**') != '' }}
        run: |
          mkdir -p site
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Allure reports — run ${{ github.run_id }}</title>
          </head>
          <body>
            <h1>Allure reports (run ${{ github.run_id }})</h1>
            <ul>
          EOF

          if [ -d site/api ]; then
            echo '<li><a href="api/">API Tests</a></li>' >> site/index.html
          fi

          if [ -d site/ui ]; then
            echo '<li><a href="ui/">UI Tests</a></li>' >> site/index.html
          fi

          cat >> site/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF
          echo "Report: https://dmytro925.github.io/manual_project_1/ (run ${{ github.run_id }})"

      - name: Publish Allure report to GitHub Pages
        if: always() && hashFiles('site/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
